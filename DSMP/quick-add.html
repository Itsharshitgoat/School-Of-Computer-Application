<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Add Task</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      color: #e2e8f0;
      height: 100px;
      width: 300px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('Wallpaper.png') no-repeat center center fixed;
      background-size: cover;
      border-radius: 12px;
      z-index: -1;
    }

    .quick-add {
      background: rgba(45, 55, 72, 0.5);
      border: 1px solid rgba(45, 55, 72, 0.6);
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      display: flex;
      gap: 8px;
    }

    input {
      flex-grow: 1;
      background: rgba(45, 55, 72, 0.5);
      color: #e2e8f0;
      border: 1px solid rgba(45, 55, 72, 0.6);
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    input:focus {
      outline: none;
      border-color: #5a67d8;
    }

    button {
      background: #5a67d8;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #4c51bf;
    }
  </style>
</head>
<body>
  <div class="quick-add">
    <input type="text" id="quickTask" placeholder="Quick add task..." required>
    <button id="quickAddButton">Add</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Quick-add DOM loaded');
      const quickAddButton = document.getElementById('quickAddButton');
      const quickTaskInput = document.getElementById('quickTask');

      if (quickAddButton) {
        quickAddButton.addEventListener('click', addQuickTask);
      } else {
        console.error('Quick Add button not found');
      }

      if (quickTaskInput) {
        quickTaskInput.focus();
        quickTaskInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') addQuickTask();
        });
      } else {
        console.error('Quick Task input not found');
      }
    });

    function addQuickTask() {
      console.log('Quick Add button clicked');
      const title = document.getElementById('quickTask')?.value.trim();
      if (!title) {
        console.error('Quick task title is empty');
        alert('Please enter a task title.');
        return;
      }

      let tasks = [];
      try {
        const Store = window.electronAPI.require('electron-store');
        const store = new Store();
        tasks = store.get('tasks') || [];
        const task = {
          id: Date.now(),
          title,
          desc: '',
          due: '',
          tag: '',
          completed: false,
          created: new Date().toISOString()
        };
        tasks.push(task);
        store.set('tasks', tasks);
        console.log('Quick task saved:', task);
      } catch (error) {
        console.warn('electron-store failed, using localStorage:', error);
        tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        tasks.push({
          id: Date.now(),
          title,
          desc: '',
          due: '',
          tag: '',
          completed: false,
          created: new Date().toISOString()
        });
        localStorage.setItem('tasks', JSON.stringify(tasks));
        console.log('Quick task saved to localStorage');
      }

      document.getElementById('quickTask').value = '';
      try {
        new Audio('https://freesound.org/data/previews/456/456905_5121236-lq.mp3').play();
      } catch (error) {
        console.error('Error playing sound:', error);
      }

      try {
        window.electronAPI.ipcRenderer.send('quick-task-added');
        window.close();
      } catch (error) {
        console.error('Error sending quick-task-added IPC:', error);
        alert('Failed to notify main window.');
      }
    }
  </script>
</body>
</html>
